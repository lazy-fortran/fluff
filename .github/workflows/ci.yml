name: test

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: test
    runs-on: [self-hosted, itp-ubuntu24]
    steps:
      - uses: actions/checkout@v4
        with:
          path: fluff

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran python3-venv
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install fpm
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Build fluff
        run: fpm build
        working-directory: fluff

      - name: Run tests
        run: fpm test
        working-directory: fluff
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
